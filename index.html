<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Arcane Horde</title>
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <div id="app">
    <section id="mainMenu" class="screen active menu-screen">
      <div class="brand">
        <div class="rune">✦</div>
        <h1>ARCANE HORDE</h1>
        <p>Action Roguelite • Bullet Heaven • Horde Survival</p>
      </div>
      <div class="menu-card">
        <button data-action="play">JOGAR</button>
        <button data-action="characters">PERSONAGENS</button>
        <button data-action="meta">MELHORIAS</button>
        <button data-action="grimoire">GRIMÓRIO</button>
        <button data-action="settings">CONFIGURAÇÕES</button>
      </div>
      <div class="footer-version">v1.0.2 • Canvas Edition</div>
    </section>

    <section id="characterScreen" class="screen panel-screen">
      <div class="panel wide">
        <div class="panel-header"><h2>Escolha seu herói</h2><button class="ghost" data-action="back">Voltar</button></div>
        <div id="characterCards" class="card-grid"></div>
        <div class="panel-footer"><button id="characterContinue" disabled>ESCOLHER MAPA</button></div>
      </div>
    </section>

    <section id="mapScreen" class="screen panel-screen">
      <div class="panel">
        <div class="panel-header"><h2>Escolha o mapa</h2><button class="ghost" data-action="characters">Voltar</button></div>
        <div id="mapCards" class="card-grid maps"></div>
        <div class="panel-footer"><button id="startGameButton" disabled>INICIAR PARTIDA</button></div>
      </div>
    </section>

    <section id="metaScreen" class="screen panel-screen">
      <div class="panel wide">
        <div class="panel-header"><div><h2>Melhorias permanentes</h2><p>Moedas: <strong id="metaCoins">0</strong></p></div><button class="ghost" data-action="back">Voltar</button></div>
        <div id="metaCards" class="card-grid"></div>
      </div>
    </section>

    <section id="grimoireScreen" class="screen panel-screen">
      <div class="panel wide">
        <div class="panel-header"><h2>Grimório</h2><button class="ghost" data-action="back">Voltar</button></div>
        <div id="grimoireList" class="grimoire-list"></div>
      </div>
    </section>

    <section id="settingsScreen" class="screen panel-screen">
      <div class="panel">
        <div class="panel-header"><h2>Configurações</h2><button class="ghost" data-action="back">Voltar</button></div>
        <div id="settingsForm" class="settings-grid"></div>
      </div>
    </section>

    <section id="hud" class="hud hidden">
      <div class="hud-left glass">
        <div class="hp-row"><span>HP</span><div class="bar"><div id="hpFill" class="fill hp"></div></div><b id="hpText">100/100</b></div>
        <div class="xp-row"><span>Nv. <b id="levelText">1</b></span><div class="bar"><div id="xpFill" class="fill xp"></div></div></div>
      </div>
      <div id="timer" class="timer glass">00:00</div>
      <div class="hud-right glass"><div>☠ <span id="killsText">0</span></div><div>◈ <span id="runCoinsText">0</span></div></div>
      <div id="weaponBar" class="weapon-bar glass"></div>
      <div id="bossHud" class="boss-hud hidden"><div id="bossName">CHEFE</div><div class="bar"><div id="bossFill" class="fill boss"></div></div></div>
      <div id="debugHud" class="debug hidden"></div>
    </section>

    <section id="levelUpModal" class="modal hidden"><div class="modal-box level-box"><h2>LEVEL UP</h2><p>Escolha uma melhoria</p><div id="levelChoices" class="choice-grid"></div></div></section>
    <section id="pauseModal" class="modal hidden"><div class="modal-box"><h2>PAUSADO</h2><button data-pause="resume">CONTINUAR</button><button data-pause="settings">CONFIGURAÇÕES</button><button data-pause="restart">REINICIAR</button><button data-pause="quit">SAIR PARA O MENU</button></div></section>
    <section id="chestModal" class="modal hidden"><div class="modal-box chest-box"><div class="chest-icon">🧰</div><h2>BAÚ ARCANO</h2><div id="chestReward"></div><button id="chestContinue">CONTINUAR</button></div></section>
    <section id="endModal" class="modal hidden"><div class="modal-box end-box"><h2 id="endTitle">VOCÊ CAIU</h2><div id="endStats" class="stats-list"></div><div class="end-actions"><button id="retryButton">TENTAR NOVAMENTE</button><button id="menuButton">MENU PRINCIPAL</button></div></div></section>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
